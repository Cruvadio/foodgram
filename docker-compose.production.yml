version: '3.3'

volumes:
  pg_data:
  static:
  media:

services:

  db:
    image: postgres:17
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
    - "5432:5432"
  backend:
    env_file:
      - .env
    container_name: backend
    build: ./backend
    volumes:
      - ./backend/:/app/
      - static:/backend_static
      - media:/media
      - ./data:/app/data
    depends_on:
      db:
        condition: service_started
      frontend:
        condition: service_completed_successfully

  frontend:
    env_file:
      - .env
    container_name: frontend
    build: ./frontend
    volumes:
      - static:/static
  nginx:
    container_name: gateway
    image: nginx:1.25.4-alpine
    env_file:
      - .env
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docs/:/usr/share/nginx/html/api/docs/
      - static:/static
      - media:/media
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
