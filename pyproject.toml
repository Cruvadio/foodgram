[tool.ruff]
line-length = 79
fix = true
[tool.ruff.lint]

select = ["E4", "E7", "E9", "F", "B"]

unfixable = ["B"]
fixable = ['ALL']


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]
"add_ingredients.py" = ["ALL"]

[tool.ruff.format]


quote-style = "single"

[tool.ruff.lint.isort]

default-section = "third-party"

known-first-party = ["backend", "api", "recipes", "users"]


[tool.ruff.lint.isort.sections]
"django" = ["django", "django.*"]

section_order = [
    "future",
    "standard_library",
    "third-party",
    "django",
    "first-party",
    "local-folder",
    "testing"
]

