[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors (most of flake8's default rules)
    "W", # pycodestyle warnings
    "F", # pyflakes (unused imports, undefined names, etc.)
    "I", # isort (mirrors flake8-isort)
]


unfixable = ["B"]
fixable = ['ALL']


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]
"add_ingredients.py" = ["ALL"]

[tool.ruff.format]


quote-style = "single"

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "django",
    "first-party",
    "local-folder",
    "testing",
]

known-first-party = [
    "backend",
    "api",
    "users",
    "recipes"
]

known-local-folder = [
    "local",
]


force-single-line = false
force-sort-within-sections = true
combine-as-imports = true

# Не переносить длинные from-import
force-wrap-aliases = false
split-on-trailing-comma = false
[tool.ruff.lint.isort.sections]

django = [
    "django",
]